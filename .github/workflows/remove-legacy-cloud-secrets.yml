name: Remove legacy cloud credentials

on:
  push:
    branches: [cleanup/standalone-runtime]

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, 'remove legacy cloud credentials') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove unused cloud credentials and media importer
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('  downloadContentFromMessage,\n', '')
          s = re.sub(r"\n// ─── Hardcoded Supabase/Cloud credentials.*?const SUPABASE_KEY = '.*?';\n", '\n', s, count=1, flags=re.S)
          p.write_text(s, encoding='utf-8')

      - name: Validate
        run: node --check index.js

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.js
          git diff --cached --quiet && exit 0
          git commit -m "chore: remove legacy cloud credentials"
          git push
